name: Build and Push Custom vLLM

on:
  push:
    branches: [ "main", "deploy-v0.22.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: docker/Dockerfile
        push: true
        tags: minhduc5a12/vllm-custom:v1
        # Lưu ý: Nếu vLLM yêu cầu dung lượng đĩa lớn hơn khi build, 
        # bạn có thể cần thêm bước dọn dẹp các công cụ thừa của máy ảo GitHub trước khi build.